# Build e test di scrap a ogni push e pull request; su un tag di versione (v*)
# pubblica anche una GitHub Release con i binari costruiti qui dal sorgente del tag.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (vet, gofmt, -race, controlli dei manuali)
        run: make test

      - name: Binari per Linux, macOS e Windows
        run: make dist

      - name: Prova il binario Linux x86-64
        run: dist/scrap-linux-amd64 --help | head -3

      - name: Conserva i binari
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # l'oggetto del tag annotato, per le note di rilascio
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # il messaggio del tag annotato diventa la descrizione della release
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "scrap $GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<'NOTES'

          Costruito e testato da GitHub Actions a partire da questo tag.

          **Quale file scaricare**

          | File | Per |
          |---|---|
          | `scrap-linux-amd64` | PC e tablet Linux con processore Intel o AMD |
          | `scrap-linux-arm64` | Raspberry Pi 4/5 e altri ARM a 64 bit |
          | `scrap-linux-armv7`, `scrap-linux-armv6` | ARM a 32 bit (Raspberry Pi più vecchi) |
          | `scrap-linux-386`, `scrap-linux-riscv64` | PC a 32 bit, schede RISC-V |
          | `scrap-darwin-arm64`, `scrap-darwin-amd64` | Mac con Apple Silicon, Mac Intel |
          | `scrap-windows-amd64.exe` | Windows a 64 bit |

          Rinomina il file in `scrap`, rendilo eseguibile con `chmod +x scrap`
          e controlla il download con `sha256sum -c SHA256SUMS --ignore-missing`.

          Manuale utente: https://nic-fio.github.io/SCRAPER/
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/scrap-* dist/SHA256SUMS \
            --title "scrap $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
