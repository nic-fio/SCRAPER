name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64,   arch: amd64 }
          - { goos: linux,   goarch: arm64,   arch: arm64 }
          - { goos: linux,   goarch: arm, goarm: '7', arch: armv7 }
          - { goos: linux,   goarch: arm, goarm: '6', arch: armv6 }
          - { goos: linux,   goarch: '386',  arch: '386' }
          - { goos: linux,   goarch: riscv64, arch: riscv64 }
          - { goos: darwin,  goarch: amd64,   arch: amd64 }
          - { goos: darwin,  goarch: arm64,   arch: arm64 }
          - { goos: windows, goarch: amd64,   arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build ${{ matrix.goos }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          name="scrap-${{ matrix.goos }}-${{ matrix.arch }}${ext}"
          go build -ldflags "-s -w" -o "$name" .
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
